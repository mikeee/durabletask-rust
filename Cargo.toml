[workspace]
members = [
    "durabletask",
    "durabletask-proto",
    "proto-gen",
]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1"

durabletask-proto = { version = "0.0.1-alpha", path = "./durabletask-proto" }

prost = "0.13.1"
prost-build = "0.14.0"
prost-types = "0.13.1"
prost-wkt-types = "0.6.0"

tonic = "0.12.1"
tonic-build = "0.12.1"

[workspace.package]
version = "0.0.1-alpha"
authors = [
    "Mike Nguyen <hey@mike.ee>",
]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mikeee/durabletask-rust"

rust-version = "1.78.0" # MSRV